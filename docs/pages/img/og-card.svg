<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0f1630"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#4F5B93" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4F5B93" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- mark -->
  <g transform="translate(600 292)" filter="url(#softShadow)">
    <ellipse cx="0" cy="40" rx="240" ry="170" fill="#777BB4"/>
    <ellipse cx="0" cy="0" rx="215" ry="145" fill="#4F5B93"/>
    <circle cx="-95" cy="-25" r="18" fill="#0f0f1a"/>
    <circle cx="95" cy="-25" r="18" fill="#0f0f1a"/>
  </g>

  <!-- wordmark -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, 'Apple Color Emoji', 'Segoe UI Emoji'" fill="#e9ecff">
    <text x="600" y="520" font-size="52" font-weight="650" text-anchor="middle">
      php-compiler
    </text>
    <text x="600" y="570" font-size="30" font-weight="450" text-anchor="middle" fill="#b9c0ff">
      A compiler for PHP in PHP that compiles itself
    </text>
  </g>
</svg>
