# Publish docs/pages/ to GitHub Pages (Settings → Pages → /docs/pages, or Actions source).
#
# DISABLED: moved to workflows-disabled/ — not executed by GitHub Actions until restored.
name: GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/pages/**'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/pages

      - id: deployment
        uses: actions/deploy-pages@v4
