# Publish docs/pages/ to GitHub Pages (Jekyll site under docs/pages/).
#
# Replaces legacy "build from /" on every master push — that caused noisy failures
# when automations merge frequently. Only runs when site content changes.
name: GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/pages/**'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/pages

      - id: deployment
        uses: actions/deploy-pages@v4
